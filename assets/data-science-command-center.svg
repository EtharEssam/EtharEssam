<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="520">
  <defs>
    <linearGradient id="hubBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10" />
      <stop offset="50%" stop-color="#0A0F1A" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101827" />
      <stop offset="100%" stop-color="#0B101D" />
    </linearGradient>

    <linearGradient id="centerCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1F38" />
      <stop offset="100%" stop-color="#08101E" />
    </linearGradient>

    <linearGradient id="borderCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <pattern id="hubGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.25" />
    </pattern>

    <filter id="pGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .node-title { font-size: 11px; font-weight: 700; fill: #94A3B8; letter-spacing: 1.5px; }
    .tech-name { font-size: 11px; font-weight: 600; fill: #F8FAFC; }
  </style>

  <!-- Base Canvas -->
  <rect width="960" height="520" rx="16" fill="url(#hubBg)" stroke="#1E293B" stroke-width="1.5" />
  <rect width="960" height="520" rx="16" fill="url(#hubGrid)" />

  <!-- Ambient Hub Glow -->
  <circle cx="480" cy="260" r="220" fill="url(#hubGlow)" />

  <!-- Outer Orbit Rings -->
  <circle cx="480" cy="260" r="145" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="3,6" />
  <circle cx="480" cy="260" r="175" fill="none" stroke="#0284C7" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="8,16">
    <animateTransform attributeName="transform" type="rotate" from="0 480 260" to="360 480 260" dur="40s" repeatCount="indefinite" />
  </circle>

  <!-- Connection Pathways & Flowing Particles -->
  <!-- Top Pathway -->
  <path d="M 480 128 L 480 195" stroke="#1E293B" stroke-width="2" />
  <path d="M 480 128 L 480 195" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,8" stroke-opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="50" to="0" dur="1.8s" repeatCount="indefinite" />
  </path>
  <circle r="3" fill="#00F0FF" filter="url(#pGlow)">
    <animateMotion path="M 480 128 L 480 195" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Bottom Pathway -->
  <path d="M 480 392 L 480 325" stroke="#1E293B" stroke-width="2" />
  <path d="M 480 392 L 480 325" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6,8" stroke-opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="50" to="0" dur="1.8s" repeatCount="indefinite" />
  </path>
  <circle r="3" fill="#38BDF8" filter="url(#pGlow)">
    <animateMotion path="M 480 392 L 480 325" dur="1.8s" repeatCount="indefinite" />
  </circle>

  <!-- Left Pathway -->
  <path d="M 292 260 L 370 260" stroke="#1E293B" stroke-width="2" />
  <path d="M 292 260 L 370 260" stroke="#A855F7" stroke-width="2" stroke-dasharray="6,8" stroke-opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="50" to="0" dur="2.2s" repeatCount="indefinite" />
  </path>
  <circle r="3" fill="#C084FC" filter="url(#pGlow)">
    <animateMotion path="M 292 260 L 370 260" dur="2.2s" repeatCount="indefinite" />
  </circle>

  <!-- Right Pathway -->
  <path d="M 668 260 L 590 260" stroke="#1E293B" stroke-width="2" />
  <path d="M 668 260 L 590 260" stroke="#F97316" stroke-width="2" stroke-dasharray="6,8" stroke-opacity="0.8">
    <animate attributeName="stroke-dashoffset" from="50" to="0" dur="2.2s" repeatCount="indefinite" />
  </path>
  <circle r="3" fill="#FB923C" filter="url(#pGlow)">
    <animateMotion path="M 668 260 L 590 260" dur="2.2s" repeatCount="indefinite" />
  </circle>

  <!-- Central Command Hub -->
  <g transform="translate(375, 200)">
    <rect x="-6" y="-6" width="222" height="132" rx="20" fill="none" stroke="#38BDF8" stroke-width="1.5">
      <animate attributeName="stroke-opacity" values="0.2;0.8;0.2" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="stroke-width" values="1;2.5;1" dur="2.5s" repeatCount="indefinite" />
    </rect>
    
    <rect width="210" height="120" rx="16" fill="url(#centerCardGrad)" stroke="url(#borderCyan)" stroke-width="1.8" />
    
    <circle cx="24" cy="24" r="4" fill="#10B981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="27" class="mono" font-size="9.5" fill="#10B981" font-weight="700">COMMAND CORE</text>
    <text x="142" y="27" class="mono" font-size="9" fill="#64748B">ACTIVE</text>

    <text x="105" y="60" text-anchor="middle" class="sans" font-size="17" font-weight="900" fill="#FFFFFF" letter-spacing="1.5">DATA SCIENCE</text>
    <text x="105" y="78" text-anchor="middle" class="mono" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="2">PIPELINE HUB</text>
    
    <rect x="20" y="90" width="170" height="18" rx="4" fill="#070E1A" stroke="#1E293B" stroke-width="0.8" />
    <text x="105" y="103" text-anchor="middle" class="mono" font-size="8.5" fill="#94A3B8">DATA → MODEL → DECISION</text>
  </g>

  <!-- Module 1: Top (Programming & Data) -->
  <g transform="translate(240, 24)">
    <rect width="480" height="104" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="22" cy="20" r="3.5" fill="#38BDF8" />
    <text x="34" y="23" class="mono node-title">PROGRAMMING &amp; DATA CORE</text>
    <text x="440" y="23" class="mono" font-size="9" fill="#475569">MOD_01</text>
    <line x1="16" y1="34" x2="464" y2="34" stroke="#1E293B" stroke-width="1" />

    <g transform="translate(16, 46)">
      <rect width="104" height="44" rx="8" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="16" cy="22" r="4.5" fill="#3776AB" />
      <text x="28" y="20" class="sans tech-name">Python</text>
      <text x="28" y="32" class="mono" font-size="8" fill="#64748B">Core Runtime</text>
    </g>

    <g transform="translate(128, 46)">
      <rect width="104" height="44" rx="8" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="16" cy="22" r="4.5" fill="#336791" />
      <text x="28" y="20" class="sans tech-name">SQL</text>
      <text x="28" y="32" class="mono" font-size="8" fill="#64748B">Query &amp; Rel</text>
    </g>

    <g transform="translate(240, 46)">
      <rect width="104" height="44" rx="8" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="16" cy="22" r="4.5" fill="#E70488" />
      <text x="28" y="20" class="sans tech-name">Pandas</text>
      <text x="28" y="32" class="mono" font-size="8" fill="#64748B">Dataframes</text>
    </g>

    <g transform="translate(352, 46)">
      <rect width="104" height="44" rx="8" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="16" cy="22" r="4.5" fill="#4DABCF" />
      <text x="28" y="20" class="sans tech-name">NumPy</text>
      <text x="28" y="32" class="mono" font-size="8" fill="#64748B">Vectorized Ops</text>
    </g>
  </g>

  <!-- Module 2: Left (Visual Intelligence & BI) -->
  <g transform="translate(32, 165)">
    <rect width="260" height="190" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="20" cy="22" r="3.5" fill="#A855F7" />
    <text x="32" y="25" class="mono node-title">VISUAL INTELLIGENCE &amp; BI</text>
    <line x1="16" y1="36" x2="244" y2="36" stroke="#1E293B" stroke-width="1" />

    <g transform="translate(16, 48)">
      <rect width="228" height="38" rx="7" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="18" cy="19" r="4" fill="#11557C" />
      <text x="32" y="19" class="sans tech-name">Matplotlib</text>
      <text x="32" y="29" class="mono" font-size="8" fill="#64748B">Statistical Plots</text>
    </g>

    <g transform="translate(16, 94)">
      <rect width="228" height="38" rx="7" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="18" cy="19" r="4" fill="#4C72B0" />
      <text x="32" y="19" class="sans tech-name">Seaborn</text>
      <text x="32" y="29" class="mono" font-size="8" fill="#64748B">Multivariate Analytics</text>
    </g>

    <g transform="translate(16, 140)">
      <rect width="228" height="38" rx="7" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="18" cy="19" r="4" fill="#F2C811" />
      <text x="32" y="19" class="sans tech-name">Power BI</text>
      <text x="32" y="29" class="mono" font-size="8" fill="#64748B">Executive Dashboards</text>
    </g>
  </g>

  <!-- Module 3: Right (Data Science & ML) -->
  <g transform="translate(668, 165)">
    <rect width="260" height="190" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="20" cy="22" r="3.5" fill="#F97316" />
    <text x="32" y="25" class="mono node-title">DATA SCIENCE &amp; ML</text>
    <line x1="16" y1="36" x2="244" y2="36" stroke="#1E293B" stroke-width="1" />

    <g transform="translate(16, 52)">
      <rect width="228" height="52" rx="7" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="18" cy="22" r="4.5" fill="#F7931E" />
      <text x="32" y="22" class="sans tech-name">Scikit-Learn</text>
      <text x="32" y="34" class="mono" font-size="8" fill="#64748B">Algorithms &amp; Pipelines</text>
      <text x="32" y="44" class="mono" font-size="7.5" fill="#38BDF8">Regression • Classification</text>
    </g>

    <g transform="translate(16, 116)">
      <rect width="228" height="52" rx="7" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="18" cy="22" r="4.5" fill="#F37626" />
      <text x="32" y="22" class="sans tech-name">Jupyter Notebook</text>
      <text x="32" y="34" class="mono" font-size="8" fill="#64748B">Interactive Prototyping</text>
      <text x="32" y="44" class="mono" font-size="7.5" fill="#10B981">Reproducible Research</text>
    </g>
  </g>

  <!-- Module 4: Bottom (Dev Tools & Versioning) -->
  <g transform="translate(240, 392)">
    <rect width="480" height="104" rx="12" fill="url(#cardGrad)" stroke="#1E293B" stroke-width="1.2" />
    <circle cx="22" cy="20" r="3.5" fill="#10B981" />
    <text x="34" y="23" class="mono node-title">DEV TOOLS &amp; VERSIONING</text>
    <text x="440" y="23" class="mono" font-size="9" fill="#475569">MOD_04</text>
    <line x1="16" y1="34" x2="464" y2="34" stroke="#1E293B" stroke-width="1" />

    <g transform="translate(26, 46)">
      <rect width="130" height="44" rx="8" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="18" cy="22" r="4.5" fill="#F05032" />
      <text x="32" y="20" class="sans tech-name">Git</text>
      <text x="32" y="32" class="mono" font-size="8" fill="#64748B">Version Control</text>
    </g>

    <g transform="translate(174, 46)">
      <rect width="130" height="44" rx="8" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="18" cy="22" r="4.5" fill="#F8FAFC" />
      <text x="32" y="20" class="sans tech-name">GitHub</text>
      <text x="32" y="32" class="mono" font-size="8" fill="#64748B">Collaboration</text>
    </g>

    <g transform="translate(322, 46)">
      <rect width="130" height="44" rx="8" fill="#0B1322" stroke="#1E293B" stroke-width="1" />
      <circle cx="18" cy="22" r="4.5" fill="#007ACC" />
      <text x="32" y="20" class="sans tech-name">VS Code</text>
      <text x="32" y="32" class="mono" font-size="8" fill="#64748B">Primary IDE</text>
    </g>
  </g>
</svg>
