<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 140" width="100%" height="140">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12" />
      <stop offset="100%" stop-color="#0A0F1A" />
    </linearGradient>

    <linearGradient id="pipeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="pBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .step-num { font-size: 8.5px; font-weight: 700; fill: #64748B; letter-spacing: 1px; }
    .step-name { font-size: 10.5px; font-weight: 700; fill: #FFFFFF; }
    .step-desc { font-size: 8px; font-weight: 500; fill: #94A3B8; }
  </style>

  <!-- Container -->
  <rect width="960" height="140" rx="14" fill="url(#wfBg)" stroke="#1E293B" stroke-width="1.2" />

  <!-- Underlying Pipeline Rail -->
  <line x1="60" y1="70" x2="900" y2="70" stroke="#1E293B" stroke-width="3" />
  
  <!-- Animated Data Flow Bus -->
  <line x1="60" y1="70" x2="900" y2="70" stroke="url(#pipeGlow)" stroke-width="3" stroke-dasharray="12,18">
    <animate attributeName="stroke-dashoffset" from="300" to="0" dur="4s" repeatCount="indefinite" />
  </line>

  <!-- Flowing Data Particles -->
  <circle r="3.5" fill="#38BDF8" filter="url(#pBlur)">
    <animateMotion path="M 60 70 L 900 70" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle r="3" fill="#10B981" filter="url(#pBlur)">
    <animateMotion path="M 60 70 L 900 70" dur="4s" begin="2s" repeatCount="indefinite" />
  </circle>

  <!-- 01. RAW DATA -->
  <g transform="translate(20, 22)">
    <rect width="112" height="96" rx="8" fill="#0C1220" stroke="#1E293B" stroke-width="1" />
    <circle cx="16" cy="18" r="3" fill="#64748B" />
    <text x="26" y="21" class="mono step-num">01. INGESTION</text>
    <text x="14" y="46" class="sans step-name">Raw Data</text>
    <text x="14" y="62" class="sans step-desc">Multi-source logs</text>
    <text x="14" y="74" class="sans step-desc">CSV / SQL / IoT</text>
    <circle cx="56" cy="90" r="3" fill="#38BDF8" />
  </g>

  <!-- 02. DATA CLEANING -->
  <g transform="translate(152, 22)">
    <rect width="112" height="96" rx="8" fill="#0C1220" stroke="#1E293B" stroke-width="1" />
    <circle cx="16" cy="18" r="3" fill="#0284C7" />
    <text x="26" y="21" class="mono step-num">02. AUDIT</text>
    <text x="14" y="46" class="sans step-name">Data Cleaning</text>
    <text x="14" y="62" class="sans step-desc">Null auditing</text>
    <text x="14" y="74" class="sans step-desc">Outlier filtering</text>
    <circle cx="56" cy="90" r="3" fill="#38BDF8" />
  </g>

  <!-- 03. PREPROCESSING -->
  <g transform="translate(284, 22)">
    <rect width="112" height="96" rx="8" fill="#0C1220" stroke="#1E293B" stroke-width="1" />
    <circle cx="16" cy="18" r="3" fill="#0284C7" />
    <text x="26" y="21" class="mono step-num">03. PREP</text>
    <text x="14" y="46" class="sans step-name">Preprocessing</text>
    <text x="14" y="62" class="sans step-desc">Mean imputation</text>
    <text x="14" y="74" class="sans step-desc">Feature transform</text>
    <circle cx="56" cy="90" r="3" fill="#38BDF8" />
  </g>

  <!-- 04. EDA -->
  <g transform="translate(416, 22)">
    <rect width="112" height="96" rx="8" fill="#0C1220" stroke="#38BDF8" stroke-width="1.2" />
    <circle cx="16" cy="18" r="3" fill="#38BDF8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="21" class="mono step-num" fill="#38BDF8">04. DISCOVERY</text>
    <text x="14" y="46" class="sans step-name" fill="#38BDF8">EDA</text>
    <text x="14" y="62" class="sans step-desc">Pattern detection</text>
    <text x="14" y="74" class="sans step-desc">Correlations</text>
    <circle cx="56" cy="90" r="3.5" fill="#38BDF8" />
  </g>

  <!-- 05. VISUALIZATION -->
  <g transform="translate(548, 22)">
    <rect width="112" height="96" rx="8" fill="#0C1220" stroke="#1E293B" stroke-width="1" />
    <circle cx="16" cy="18" r="3" fill="#A855F7" />
    <text x="26" y="21" class="mono step-num">05. VISUALS</text>
    <text x="14" y="46" class="sans step-name">Visualization</text>
    <text x="14" y="62" class="sans step-desc">Seaborn / PowerBI</text>
    <text x="14" y="74" class="sans step-desc">Executive plots</text>
    <circle cx="56" cy="90" r="3" fill="#A855F7" />
  </g>

  <!-- 06. INSIGHTS -->
  <g transform="translate(680, 22)">
    <rect width="112" height="96" rx="8" fill="#0C1220" stroke="#1E293B" stroke-width="1" />
    <circle cx="16" cy="18" r="3" fill="#F97316" />
    <text x="26" y="21" class="mono step-num">06. VALUE</text>
    <text x="14" y="46" class="sans step-name">Insights</text>
    <text x="14" y="62" class="sans step-desc">Root causes</text>
    <text x="14" y="74" class="sans step-desc">Bottlenecks</text>
    <circle cx="56" cy="90" r="3" fill="#F97316" />
  </g>

  <!-- 07. DATA-DRIVEN DECISIONS -->
  <g transform="translate(812, 22)">
    <rect width="128" height="96" rx="8" fill="#0C1524" stroke="#10B981" stroke-width="1.2" />
    <circle cx="16" cy="18" r="3" fill="#10B981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="21" class="mono step-num" fill="#10B981">07. IMPACT</text>
    <text x="14" y="46" class="sans step-name" fill="#10B981">Decisions</text>
    <text x="14" y="62" class="sans step-desc">Operational action</text>
    <text x="14" y="74" class="sans step-desc">Optimization</text>
    <circle cx="64" cy="90" r="3.5" fill="#10B981" />
  </g>
</svg>
