<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 70" width="100%" height="70">
  <defs>
    <linearGradient id="connGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3" />
    </linearGradient>
    <filter id="cBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'Courier New', monospace; font-size: 8.5px; fill: #64748B; }
  </style>

  <!-- Top Ingress Node -->
  <circle cx="480" cy="10" r="4" fill="#38BDF8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="495" y="13" class="mono">DISPATCH: CHANNELS</text>

  <!-- Static Traces -->
  <path d="M 480 14 L 480 32 L 180 32 L 180 65" fill="none" stroke="#1E293B" stroke-width="1.8" />
  <path d="M 480 14 L 480 65" fill="none" stroke="#1E293B" stroke-width="1.8" />
  <path d="M 480 14 L 480 32 L 780 32 L 780 65" fill="none" stroke="#1E293B" stroke-width="1.8" />

  <!-- Animated Glowing Traces -->
  <path d="M 480 14 L 480 32 L 180 32 L 180 65" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="6,12" stroke-opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="2.5s" repeatCount="indefinite" />
  </path>
  <path d="M 480 14 L 480 65" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-dasharray="6,12" stroke-opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="2.2s" repeatCount="indefinite" />
  </path>
  <path d="M 480 14 L 480 32 L 780 32 L 780 65" fill="none" stroke="#00F0FF" stroke-width="1.8" stroke-dasharray="6,12" stroke-opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="60" to="0" dur="2.5s" repeatCount="indefinite" />
  </path>

  <!-- Traveling Packets -->
  <circle r="2.8" fill="#38BDF8" filter="url(#cBlur)">
    <animateMotion path="M 480 14 L 480 32 L 180 32 L 180 65" dur="2.5s" repeatCount="indefinite" />
  </circle>
  <circle r="2.8" fill="#38BDF8" filter="url(#cBlur)">
    <animateMotion path="M 480 14 L 480 65" dur="2.2s" repeatCount="indefinite" />
  </circle>
  <circle r="2.8" fill="#00F0FF" filter="url(#cBlur)">
    <animateMotion path="M 480 14 L 480 32 L 780 32 L 780 65" dur="2.5s" repeatCount="indefinite" />
  </circle>

  <!-- Terminals -->
  <circle cx="180" cy="65" r="3.5" fill="#38BDF8" />
  <circle cx="480" cy="65" r="3.5" fill="#38BDF8" />
  <circle cx="780" cy="65" r="3.5" fill="#00F0FF" />
</svg>
