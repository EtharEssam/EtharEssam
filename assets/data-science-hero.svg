<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" height="280">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B12" />
      <stop offset="50%" stop-color="#0A101D" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>

    <!-- Radial Core Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="30" cy="0" r="0.8" fill="#38BDF8" fill-opacity="0.4" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'Fira Code', 'Courier New', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Base Card -->
  <rect x="2" y="2" width="956" height="276" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Background Tech Grid -->
  <rect x="4" y="4" width="952" height="272" rx="12" fill="url(#gridPattern)" />

  <!-- Ambient Glow Center -->
  <circle cx="480" cy="140" r="220" fill="url(#centerGlow)" />

  <!-- Flowing Data Streams (Horizontal Left & Right Buses) -->
  <path d="M 60 140 L 240 140 L 300 140" stroke="#1E293B" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 60 140 L 240 140 L 300 140" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8,12" stroke-opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="3s" repeatCount="indefinite" />
  </path>

  <path d="M 900 140 L 720 140 L 660 140" stroke="#1E293B" stroke-width="2" stroke-dasharray="4,4" />
  <path d="M 900 140 L 720 140 L 660 140" stroke="#38BDF8" stroke-width="2" stroke-dasharray="8,12" stroke-opacity="0.6">
    <animate attributeName="stroke-dashoffset" from="0" to="100" dur="3s" repeatCount="indefinite" />
  </path>

  <!-- Top Flow Curve -->
  <path d="M 160 40 Q 480 80 800 40" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-opacity="0.4" />
  <path d="M 160 40 Q 480 80 800 40" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="10,25" stroke-opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="140" to="0" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- Bottom Flow Curve -->
  <path d="M 160 240 Q 480 200 800 240" fill="none" stroke="#1E293B" stroke-width="1.2" stroke-opacity="0.4" />
  <path d="M 800 240 Q 480 200 160 240" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="8,20" stroke-opacity="0.7">
    <animate attributeName="stroke-dashoffset" from="140" to="0" dur="4s" repeatCount="indefinite" />
  </path>

  <!-- Traveling Data Particles -->
  <circle r="3" fill="#00F0FF" filter="url(#glowFilter)">
    <animateMotion path="M 60 140 L 320 140" dur="2.4s" repeatCount="indefinite" />
  </circle>
  <circle r="3.5" fill="#38BDF8" filter="url(#glowFilter)">
    <animateMotion path="M 900 140 L 640 140" dur="2.8s" repeatCount="indefinite" />
  </circle>
  <circle r="2.5" fill="#38BDF8">
    <animateMotion path="M 160 40 Q 480 80 800 40" dur="3.6s" repeatCount="indefinite" />
  </circle>

  <!-- Telemetry Nodes Left -->
  <g transform="translate(70, 75)">
    <rect width="115" height="42" rx="6" fill="#0D1322" stroke="#1E293B" stroke-width="1" />
    <circle cx="16" cy="21" r="3.5" fill="#10B981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" class="mono" font-size="9" fill="#64748B" font-weight="600">INPUT STAGE</text>
    <text x="28" y="31" class="sans" font-size="11" fill="#F1F5F9" font-weight="700">RAW DATA</text>
  </g>

  <!-- Telemetry Nodes Right -->
  <g transform="translate(775, 75)">
    <rect width="115" height="42" rx="6" fill="#0D1322" stroke="#1E293B" stroke-width="1" />
    <circle cx="16" cy="21" r="3.5" fill="#38BDF8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" class="mono" font-size="9" fill="#64748B" font-weight="600">OUTPUT STAGE</text>
    <text x="28" y="31" class="sans" font-size="11" fill="#F1F5F9" font-weight="700">INSIGHTS</text>
  </g>

  <!-- Top Live Telemetry Pill -->
  <g transform="translate(380, 24)">
    <rect width="200" height="24" rx="12" fill="#0E1726" stroke="#1E293B" stroke-width="1" />
    <circle cx="18" cy="12" r="3.5" fill="#10B981">
      <animate attributeName="r" values="3;4.5;3" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;1;0.7" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="16" class="mono" font-size="10" fill="#38BDF8" font-weight="700" letter-spacing="1.2">SYSTEM: ONLINE</text>
    <text x="135" y="16" class="mono" font-size="10" fill="#64748B">v2.6.4</text>
  </g>

  <!-- Main Hero Title -->
  <text x="480" y="125" text-anchor="middle" class="sans" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="3.5">
    ETHAR ESSAM
  </text>

  <!-- Subtitle with Glowing Accent -->
  <text x="480" y="162" text-anchor="middle" class="mono" font-size="15" font-weight="700" fill="url(#cyanGrad)" letter-spacing="4">
    DATA SCIENTIST  |  DATA ANALYST
  </text>

  <!-- Mission Statement -->
  <text x="480" y="196" text-anchor="middle" class="sans" font-size="13" font-weight="400" fill="#94A3B8" letter-spacing="0.4">
    Synthesizing raw data into predictive intelligence, statistical clarity, and high-impact business decisions.
  </text>

  <!-- Bottom Flow Sequence Indicator -->
  <g transform="translate(230, 222)">
    <rect width="500" height="32" rx="8" fill="#0D1322" stroke="#1E293B" stroke-width="1" />
    
    <text x="35" y="20" class="mono" font-size="10.5" fill="#64748B" font-weight="600">DATA</text>
    <text x="95" y="20" class="mono" font-size="11" fill="#38BDF8">→</text>
    
    <text x="135" y="20" class="mono" font-size="10.5" fill="#64748B" font-weight="600">ANALYSIS</text>
    <text x="215" y="20" class="mono" font-size="11" fill="#38BDF8">→</text>
    
    <text x="250" y="20" class="mono" font-size="10.5" fill="#38BDF8" font-weight="700">MACHINE LEARNING</text>
    <text x="390" y="20" class="mono" font-size="11" fill="#38BDF8">→</text>
    
    <text x="425" y="20" class="mono" font-size="10.5" fill="#10B981" font-weight="700">DECISION</text>
  </g>
</svg>
